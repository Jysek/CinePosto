# CI monorepo.
#
# I test girano DENTRO le immagini Docker, le stesse che si usano in locale e in produzione:
# così "funziona sulla mia macchina" e "funziona in CI" sono la stessa cosa, e la versione
# di Python è definita in un posto solo (backend/Dockerfile, scraper/Dockerfile).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una push nuova annulla la run precedente sullo stesso branch: non sprechiamo runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Backend e scraper (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Messaggi di console ASCII (make check-console)
        # La console di Windows (CP850) non decodifica l'UTF-8: i messaggi di `make` e degli
        # script devono restare ASCII, altrimenti l'em dash esce come "â€”". Controllo da un secondo.
        run: make check-console

      - uses: docker/setup-buildx-action@v3

      - name: Build delle immagini
        run: docker compose --profile scrape build

      - name: Backend — lint (ruff)
        run: docker compose run --rm backend python -m ruff check app/ tests/

      - name: Backend — format (ruff)
        run: docker compose run --rm backend python -m ruff format --check app/ tests/

      - name: Backend — test
        run: docker compose run --rm backend python -m pytest tests/ -q

      - name: Scraper — lint (ruff)
        run: docker compose run --rm scraper python -m ruff check scraper/ tests/

      - name: Scraper — format (ruff)
        run: docker compose run --rm scraper python -m ruff format --check scraper/ tests/

      - name: Scraper — test con coverage (minimo 60%)
        run: docker compose run --rm scraper python -m pytest tests/ --cov --cov-report=term-missing --cov-fail-under=60

      - name: La configurazione di produzione è valida?
        # Verifica che compose.prod.yaml si risolva (volumi, Caddy, variabili obbligatorie).
        run: |
          ADMIN_TOKEN=ci CORS_ORIGINS='["https://example.org"]' \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet

  app:
    name: App (Expo web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Build web (expo export)
        # La build statica è il modo più veloce per accorgersi di un errore di sintassi,
        # di un import rotto o di un asset corrotto (è così che è emerso il favicon invalido).
        run: npx expo export --platform web

      - name: Diagnostica (expo-doctor)
        # Controlla che le dipendenze native restino allineate all'SDK di Expo e che
        # app.json sia valido: gli stessi controlli fatti a mano dopo un upgrade.
        run: npx expo-doctor@latest
